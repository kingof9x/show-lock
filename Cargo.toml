[package]
name = "show-lock"
version = "0.0.0"
edition = "2021"
description = "Lock your Windows laptop without blanking the projector: a password lock screen that leaves other displays playing"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT, only for Windows Hello (UserConsentVerifier).
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"
# The lock screen's native window handle, from eframe.
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
# Lets `--preview` open a window on Linux too (development only).
eframe = { version = "0.37", default-features = false, features = ["x11"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
